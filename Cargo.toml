[package]
name = "fatsus_api"
version = "3.0.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "migrate", "macros"] }
jsonwebtoken = "9"
dotenvy = "0.15"
sha2 = "0.10"
subtle = "2"
tower-http = { version = "0.5", features = ["limit", "timeout", "compression-gzip"] }

utoipa = { version = "4.2", features = ["axum_extras", "chrono", "preserve_order"] }
utoipa-swagger-ui = { version = "7.1", features = ["axum"] }

